services:
  bikes:
    build: .
    image: biketouren:${APP_VERSION:-dev}
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://app:app@bikes-db:5432/app
    depends_on:
      bikes-db:
        condition: service_healthy
    restart: unless-stopped

  tours:
    image: biketouren:${APP_VERSION:-dev}
    command: ["bun", "src/tours/server.ts"]
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DATABASE_URL: postgres://app:app@tours-db:5432/app
      BIKE_SERVICE_URL: http://bikes:3000
    depends_on:
      tours-db:
        condition: service_healthy
      bikes:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const r = await fetch('http://127.0.0.1:3001/health'); process.exit(r.ok ? 0 : 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  bikes-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - bikes-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  tours-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - tours-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  bikes-data:
  tours-data:
