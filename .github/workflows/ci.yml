name: CI

on:
  push:
    branches: [main, develop, "feature/**", "fix/**"]
    paths: ["Code/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["Code/**", ".github/workflows/ci.yml"]
  workflow_dispatch:

# A newer push on the same branch/PR cancels the previous run, so CI doesn't
# queue up stale runs while you push fixes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The Bun project lives in Code/, one level below this monorepo's root
# (which also holds Theorie/, Dokumentation/, ...) — every run: step below
# operates on that subdirectory.
defaults:
  run:
    working-directory: Code

jobs:
  test:
    name: Static checks and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned to match the Dockerfile and local dev, so CI can't pass on
          # a Bun version that behaves differently elsewhere.
          bun-version: "1.3.13"

      - run: bun install --frozen-lockfile

      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test tests/unit
      - run: bun test tests/integration

  docker-build:
    name: Docker build and system test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Build versioned service image
        env:
          APP_VERSION: ${{ github.sha }}
        run: docker compose build bikes

      - name: Start both services and databases
        env:
          APP_VERSION: ${{ github.sha }}
        run: docker compose up -d --no-build

      - name: Wait for both APIs
        run: |
          for i in $(seq 1 30); do
            if curl -fsS localhost:3000/health && curl -fsS localhost:3001/health; then
              exit 0
            fi
            sleep 2
          done
          echo "services never became healthy" >&2
          docker compose logs
          exit 1

      - name: Check bike and tour workflow
        run: bun tests/system/smoke.ts

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
