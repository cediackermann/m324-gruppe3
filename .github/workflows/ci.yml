name: CI

on:
  push:
    branches: [main, develop, "feature/**", "fix/**"]
    paths: ["Code/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["Code/**", ".github/workflows/ci.yml"]
  workflow_dispatch:

# A newer push on the same branch/PR cancels the previous run, so CI doesn't
# queue up stale runs while you push fixes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The Bun project lives in Code/, one level below this monorepo's root
# (which also holds Theorie/, Dokumentation/, ...) — every run: step below
# operates on that subdirectory.
defaults:
  run:
    working-directory: Code

jobs:
  test:
    name: Static checks and tests
    runs-on: ubuntu-latest
    # Real Postgres for the integration tests; same major version as Compose.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned to match the Dockerfile and local dev, so CI can't pass on
          # a Bun version that behaves differently elsewhere.
          bun-version: "1.3.13"

      - run: bun install --frozen-lockfile

      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test tests/unit
      - run: bun test tests/integration
        env:
          TEST_DATABASE_URL: postgres://app:app@localhost:5432/app_test

  docker-build:
    name: Docker build and system test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Build versioned image
        env:
          APP_VERSION: ${{ github.sha }}
        run: docker compose build app

      - name: Start app and database
        env:
          APP_VERSION: ${{ github.sha }}
        run: docker compose up -d --no-build

      - name: Wait for the API
        env:
          APP_VERSION: ${{ github.sha }}
        run: |
          for i in $(seq 1 30); do
            if curl -fsS localhost:3000/health | jq -e --arg v "$APP_VERSION" '.version == $v'; then
              exit 0
            fi
            sleep 2
          done
          echo "services never became healthy" >&2
          docker compose logs
          exit 1

      - name: Check bike and tour workflow
        run: bun tests/system/smoke.ts

      # Only main is published. The image that passed the system test is
      # handed to the publish job as is, so the registry gets exactly the
      # tested bytes instead of a rebuild.
      - name: Save tested image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save "biketouren:$GITHUB_SHA" | gzip > image.tar.gz

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: biketouren-image
          path: Code/image.tar.gz
          retention-days: 1

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v

  publish:
    name: Publish image to GHCR
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # GITHUB_TOKEN may push packages of this repository only; no other
    # secret is needed.
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/cediackermann/biketouren
    # No checkout: this job only handles the image from docker-build.
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: biketouren-image

      - name: Load tested image
        run: gunzip -c image.tar.gz | docker load

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # sha-<commit> is immutable and identifies the artifact; main always
      # points to the newest tested commit on main.
      - name: Tag and push
        run: |
          for tag in "sha-$GITHUB_SHA" main; do
            docker tag "biketouren:$GITHUB_SHA" "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done

      - name: Report published artifact
        run: |
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:sha-$GITHUB_SHA")
          version=$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$IMAGE:sha-$GITHUB_SHA")
          echo "Published $IMAGE:sha-$GITHUB_SHA ($digest), revision label $version"
          {
            echo "## Published artifact"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Image | \`$IMAGE\` |"
            echo "| Tags | \`sha-$GITHUB_SHA\`, \`main\` |"
            echo "| Digest | \`${digest#*@}\` |"
            echo "| Revision label | \`$version\` |"
            echo
            echo "\`\`\`bash"
            echo "docker pull $IMAGE:sha-$GITHUB_SHA"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
