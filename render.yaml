# Render Blueprint for the production API (Render dashboard: New > Blueprint).
# The database is hosted on Neon; its connection string is entered once in
# the Render dashboard and never stored in this repository.
services:
  - name: biketouren
    type: web
    runtime: docker
    plan: free
    region: frankfurt
    # Paths below are relative to rootDir.
    rootDir: Code
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    # Render deploys a new commit on main only after all of its GitHub
    # Actions checks have passed, and skips it if any check fails.
    branch: main
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        sync: false
