# Render Blueprint for the production API (Render dashboard: New > Blueprint).
# The database is hosted on Neon; its connection string is entered once in
# the Render dashboard and never stored in this repository.
services:
  - name: biketouren
    type: web
    runtime: docker
    plan: free
    region: frankfurt
    # Paths below are relative to rootDir.
    rootDir: Code
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    # Deploys are triggered only by the CI pipeline's deploy job (deploy
    # hook), after all tests have passed.
    autoDeployTrigger: "off"
    envVars:
      - key: DATABASE_URL
        sync: false
